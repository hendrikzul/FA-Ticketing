services:
  # ============================================
  # PostgreSQL - Source of Truth Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: aicop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: aicop
      POSTGRES_USER: aicop
      POSTGRES_PASSWORD: aicop_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aicop -d aicop"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis - Queue & Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: aicop-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Laravel Backend API
  # ============================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${AICOP_BACKEND_BASE_IMAGE:-php:8.4-cli-bookworm}
        SKIP_SYSTEM_DEPS: ${AICOP_BACKEND_SKIP_SYSTEM_DEPS:-0}
    container_name: aicop-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/var/www/html
      - backend_vendor:/var/www/html/vendor
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: aicop
      DB_USERNAME: aicop
      DB_PASSWORD: aicop_secret
      REDIS_HOST: redis
      REDIS_PORT: 6379
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://aicop-uat.floweradvisor.co.id/api/auth/google/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["/bin/sh", "/var/www/html/scripts/start-container.sh"]

  # ============================================
  # Python FastAPI Worker (AI Orchestrator)
  # ============================================
  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${AICOP_WORKER_BASE_IMAGE:-python:3.12-slim}
        SKIP_SYSTEM_DEPS: ${AICOP_WORKER_SKIP_SYSTEM_DEPS:-0}
    container_name: aicop-worker
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./worker:/app
    environment:
      DATABASE_URL: postgresql://aicop:aicop_secret@postgres:5432/aicop
      REDIS_URL: redis://redis:6379/0
      OLLAMA_HOST: host.docker.internal
      OLLAMA_PORT: "11434"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================
  # Next.js Frontend
  # ============================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ${AICOP_FRONTEND_BASE_IMAGE:-node:22-alpine}
    container_name: aicop-frontend
    restart: unless-stopped
    ports:
      - "3002:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    environment:
      NEXT_PUBLIC_API_URL: /api
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    depends_on:
      - backend
    command: ["/bin/sh", "/app/scripts/start-container.sh"]

volumes:
  postgres_data:
  redis_data:
  backend_vendor:
  frontend_node_modules:
  frontend_next:
